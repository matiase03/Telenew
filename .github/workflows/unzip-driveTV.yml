name: Unzip DriveTV-fixed.zip and commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check for zip and unzip
        run: |
          if [ ! -f DriveTV-fixed.zip ]; then
            echo "No DriveTV-fixed.zip found, exiting."
            exit 0
          fi
          unzip -o DriveTV-fixed.zip -d .

      - name: Commit unzipped files and remove zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --ignore-unmatch DriveTV-fixed.zip
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unzip DriveTV-fixed.zip and remove the zip"
          git push
